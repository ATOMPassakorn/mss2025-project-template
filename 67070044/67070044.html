<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khanun Server Monitor</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1; --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
            --dark: #1e293b; --bg: #f1f5f9; --card-bg: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body { font-family: 'Outfit', sans-serif; background-color: var(--bg); color: var(--dark); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }

        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { margin: 0; font-weight: 700; display: flex; align-items: center; gap: 10px; font-size: 1.5rem; }
        .live-badge { background: #dcfce7; color: #166534; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 500; display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; background: #166534; border-radius: 50%; animation: pulse 2s infinite; }

        /* Card Styles */
        .card { background: var(--card-bg); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); margin-bottom: 20px; transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); }
        
        /* System Info Section (NEW) */
        .sys-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .sys-item { display: flex; align-items: center; gap: 12px; padding: 10px; background: #f8fafc; border-radius: 10px; }
        .sys-icon { width: 40px; height: 40px; background: #e0e7ff; color: var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .sys-detail h4 { margin: 0; font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
        .sys-detail p { margin: 2px 0 0 0; font-weight: 600; font-size: 0.95rem; }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; color: #64748b; font-weight: 500; }
        .metric-value { font-size: 2.5rem; font-weight: 700; margin-bottom: 10px; }
        
        /* Bars */
        .progress-bg { background: #e2e8f0; height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }

        /* Table */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: #64748b; font-size: 0.85rem; padding: 12px; border-bottom: 2px solid #e2e8f0; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
        .pid-tag { background: #e0e7ff; color: #4338ca; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 0.8rem; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        
        /* Mobile responsive */
        @media (max-width: 600px) { .sys-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>
            Khanun Monitor
        </h1>
        <div class="live-badge"><span class="dot"></span> <span id="time">Connecting...</span></div>
    </header>

    <div class="card">
        <div class="sys-grid">
            <div class="sys-item">
                <div class="sys-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
                <div class="sys-detail">
                    <h4>Hostname</h4>
                    <p id="sys-hostname">Loading...</p>
                </div>
            </div>
            <div class="sys-item">
                <div class="sys-icon" style="color: #ec4899; background: #fce7f3;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>
                </div>
                <div class="sys-detail">
                    <h4>OS System</h4>
                    <p id="sys-os">Loading...</p>
                </div>
            </div>
            <div class="sys-item">
                <div class="sys-icon" style="color: #f59e0b; background: #fef3c7;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
                </div>
                <div class="sys-detail">
                    <h4>Kernel</h4>
                    <p id="sys-kernel">Loading...</p>
                </div>
            </div>
            <div class="sys-item">
                <div class="sys-icon" style="color: #10b981; background: #d1fae5;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                </div>
                <div class="sys-detail">
                    <h4>Uptime</h4>
                    <p id="sys-uptime">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="stats-grid">
        <div class="card">
            <div class="card-header"><span>CPU Usage</span></div>
            <div class="metric-value"><span id="cpu-txt">0</span>%</div>
            <div class="progress-bg"><div id="cpu-bar" class="progress-fill" style="width: 0%; background: var(--primary);"></div></div>
        </div>
        <div class="card">
            <div class="card-header"><span>Memory Usage</span></div>
            <div class="metric-value"><span id="mem-txt">0</span>%</div>
            <div class="progress-bg"><div id="mem-bar" class="progress-fill" style="width: 0%; background: var(--success);"></div></div>
        </div>
        <div class="card">
            <div class="card-header"><span>Disk (Root)</span></div>
            <div class="metric-value"><span id="disk-txt">0</span>%</div>
            <div class="progress-bg"><div id="disk-bar" class="progress-fill" style="width: 0%; background: var(--warning);"></div></div>
        </div>
    </div>

    <div class="card">
        <div class="card-header" style="margin-bottom: 20px;">Top Processes</div>
        <table>
            <thead><tr><th>PID</th><th>USER</th><th>CPU%</th><th>MEM%</th><th>COMMAND</th></tr></thead>
            <tbody id="proc-list"></tbody>
        </table>
    </div>
</div>

<script>
    // ==========================================
    // !!! แก้ IP ตรงนี้ให้ตรงกับ Server คุณ !!!
    // ==========================================
    const SERVER_URL = "http://192.168.208.130/data.json"; 

    async function updateDashboard() {
        try {
            const response = await fetch(SERVER_URL + "?t=" + Date.now());
            if (!response.ok) throw new Error("Network error");
            const data = await response.json();

            // 1. System Info (ของใหม่)
            if(data.system) {
                document.getElementById('sys-hostname').innerText = data.system.hostname;
                document.getElementById('sys-os').innerText = data.system.os;
                document.getElementById('sys-kernel').innerText = data.system.kernel;
                document.getElementById('sys-uptime').innerText = data.system.uptime;
            }

            // 2. Metrics
            document.getElementById('time').innerText = data.timestamp;
            
            document.getElementById('cpu-txt').innerText = data.cpu;
            document.getElementById('cpu-bar').style.width = data.cpu + "%";
            
            document.getElementById('mem-txt').innerText = data.memory;
            document.getElementById('mem-bar').style.width = data.memory + "%";

            document.getElementById('disk-txt').innerText = data.disk;
            document.getElementById('disk-bar').style.width = data.disk + "%";

            // 3. Table
            const tbody = document.getElementById('proc-list');
            tbody.innerHTML = '';
            data.processes.forEach(proc => {
                const shortCmd = proc.command.length > 50 ? proc.command.substring(0, 50) + "..." : proc.command;
                tbody.innerHTML += `
                    <tr>
                        <td><span class="pid-tag">${proc.pid}</span></td>
                        <td style="font-weight:500">${proc.user}</td>
                        <td style="font-weight:bold">${proc.cpu}%</td>
                        <td>${proc.mem}%</td>
                        <td style="color:#64748b">${shortCmd}</td>
                    </tr>`;
            });

        } catch (error) {
            console.error(error);
            document.getElementById('time').innerText = "Offline";
            document.getElementById('time').style.color = "red";
        }
    }
    updateDashboard();
    setInterval(updateDashboard, 2000);
</script>

</body>
</html>

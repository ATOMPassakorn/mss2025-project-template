      </div>

      <div class="card">
        <div class="card-icon">⏰</div>
        <h2>Last Update</h2>
        <div class="value" id="update">21 November 2025 11:00:02</div>
      </div>

      <div class="card">
        <div class="card-icon">📍</div>
          <h2>IP Address</h2>
          <div class="value" id="ip">192.168.229.128</div>
        </div>
              <div class="card">

              <h2>Number of Cores</h2>

            </div>
        </div>
      </div>
      </div>

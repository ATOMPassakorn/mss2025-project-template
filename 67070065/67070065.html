<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Server Status - 67070065</title>

  <link rel="stylesheet" href="styles.css">

</head>
<body>
  <div class="card">
    <h1>
      Nine'szaza server
      <span id="lastUpdated"></span>
    </h1>

    <div class="metrics">
      <div class="metric">
        <div class="metric-title">CPU Usage</div>
        <div class="metric-value" id="cpu"></div>
      </div>
      <div class="metric">
        <div class="metric-title">Memory Usage</div>
        <div class="metric-value" id="memory"></div>
      </div>
      <div class="metric">
        <div class="metric-title">Disk Usage</div>
        <div class="metric-value" id="disk"></div>
        <div class="metric-sub" id="diskDetail"></div>
      </div>
      <div class="metric">
        <div class="metric-title">Network</div>
        <div class="metric-value" id="network"></div>
      </div>
    </div>

    <h2>System Info (neofetch)</h2>
    <pre id="neofetch"></pre>
  </div>

  <script>
    async function loadStatus() {
      try {
        const res = await fetch("data.json?cache=" + Date.now());
        const data = await res.json();

        document.getElementById("cpu").textContent =
          data.cpu_usage + " %";
        document.getElementById("memory").textContent =
          data.mem_usage + " %";
        document.getElementById("disk").textContent =
          data.disk_usage;
        document.getElementById("diskDetail").textContent =
          data.disk_used + " / " + data.disk_total;

        document.getElementById("network").textContent =
          `RX ${data.rx_human} / TX ${data.tx_human} (${data.iface})`;

        document.getElementById("lastUpdated").textContent =
          "Last updated: " + data.last_updated;

        document.getElementById("neofetch").textContent =
          data.neofetch;
      } catch (err) {
        console.error("Error loading data.json", err);
      }
    }

    loadStatus();
    setInterval(loadStatus, 60000);
  </script>
</body>
</html>
